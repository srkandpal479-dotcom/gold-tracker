name: Gold tracker

on:
  schedule:
    - cron: "*/10 * * * *"   # har 10 minute (GitHub ka minimum 5 minute hai)
  workflow_dispatch:          # haath se "Run workflow" button ke liye

concurrency:
  group: gold-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Locate Amazon SDK
        run: |
          if [ -f creatorsapi_python_sdk.zip ]; then unzip -q -o creatorsapi_python_sdk.zip; fi
          d=$(find . -type d -name creatorsapi_python_sdk | head -n 1)
          if [ -z "$d" ]; then
            echo "SDK folder 'creatorsapi_python_sdk' repo mein nahi mila. Use repo ke root mein upload karo."
            exit 1
          fi
          echo "SDK mila: $d"
          echo "PYTHONPATH=$(cd "$(dirname "$d")" && pwd)" >> "$GITHUB_ENV"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Products list from secret (optional)
        env:
          PRODUCTS_CSV: ${{ secrets.PRODUCTS_CSV }}
        run: |
          if [ -n "$PRODUCTS_CSV" ]; then printf '%s\n' "$PRODUCTS_CSV" > products.csv; fi

      - name: Sync from Google Sheet
        env:
          MARKET_CSV_URL: ${{ secrets.MARKET_CSV_URL }}
          OFFERS_CSV_URL: ${{ secrets.OFFERS_CSV_URL }}
          SKUS_CSV_URL: ${{ secrets.SKUS_CSV_URL }}
          MARKET_PREV_URL: https://rupyabachao.com/gold/market.json
          OUT_DIR: out
        run: python sheet_sync.py

      - name: Run tracker
        env:
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          AMAZON_CREDENTIAL_VERSION: ${{ secrets.AMAZON_CREDENTIAL_VERSION }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          OUT_DIR: out
        run: python tracker.py

      - name: Upload to Hostinger
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: python upload.py
